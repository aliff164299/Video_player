<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WWE Network Style Player</title>
<style>
  :root{--bg:#000;--panel:#121212;--text:#fff;--muted:#a8a8a8;--accent:#e4002b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(ellipse at top,#2a0006 0,var(--bg) 55%) fixed;background-color:var(--bg);color:var(--text);font-family:"Helvetica Neue",Arial,sans-serif;min-height:100vh}
  header{display:flex;align-items:center;gap:24px;padding:14px 5vw;background:#000;border-bottom:2px solid var(--accent)}
  .logo{font-weight:900;font-size:22px;letter-spacing:2px;text-transform:uppercase}
  .logo span{color:var(--accent)}
  nav{display:flex;gap:20px;font-size:14px;color:var(--muted)}
  nav a{color:inherit;text-decoration:none}
  nav a:hover{color:#fff}
  .live{margin-left:auto;background:#e4002b;font-size:11px;font-weight:800;padding:4px 10px;border-radius:3px;letter-spacing:1px}
  main{max-width:1100px;margin:0 auto;padding:28px 5vw 60px}
  .player{position:relative;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .player iframe,.player .thumb{position:absolute;inset:0;width:100%;height:100%;border:0}
  .thumb{background:center/cover no-repeat;cursor:pointer;border:0;display:block}
  .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.1) 55%)}
  .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;width:84px;height:84px;border-radius:50%;background:var(--accent);display:grid;place-items:center;transition:.2s;box-shadow:0 0 0 8px rgba(228,0,43,.35)}
  .thumb:hover .play{transform:translate(-50%,-50%) scale(1.1)}
  .play svg{width:34px;height:34px;fill:#fff;margin-left:5px}
  .caption{position:absolute;left:20px;bottom:16px;right:20px;z-index:2;text-align:left;font-size:clamp(14px,2.4vw,24px);font-weight:800;line-height:1.25}
  .info{margin-top:22px}
  .tag{display:inline-block;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
  h1{font-size:clamp(20px,3.4vw,32px);line-height:1.2}
  .meta{color:var(--muted);font-size:14px;margin:8px 0 16px}
  .desc{color:#dcdcdc;line-height:1.6;font-size:15px;background:var(--panel);padding:18px;border-radius:6px;border-left:3px solid var(--accent)}
</style>
</head>
<body>
<header>
  <div class="logo">WWE <span>Network</span></div>
  <nav><a href="#">Home</a><a href="#">Live</a><a href="#">Shows</a><a href="#">PPVs</a></nav>
  <div class="live">LIVE</div>
</header>

<main>
  <div class="player" id="player">
    <button class="thumb" id="thumb" aria-label="Play video"
      style="background-image:url('https://i.ytimg.com/vi/4Bgg4P-xnHY/maxresdefault.jpg'),url('https://i.ytimg.com/vi/4Bgg4P-xnHY/hqdefault.jpg')">
      <span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
    </button>
  </div>

  <p id="yt-link" hidden style="margin-top:12px;font-size:14px;color:#a8a8a8">Video not loading? <a style="color:#e4002b;font-weight:700" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=4Bgg4P-xnHY">Watch on YouTube</a></p>

  <div class="info">
    <h1 id="title">WWE</h1>
  </div>
</main>

<script>
  document.getElementById('thumb').addEventListener('click', function () {
    var f = document.createElement('iframe');
    var link = document.getElementById('yt-link'); if (link) link.hidden = false;
    f.src = 'https://www.youtube.com/embed/4Bgg4P-xnHY?autoplay=1&rel=0';
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.title = document.getElementById('title').textContent;
    document.getElementById('player').replaceChildren(f);
  });

  fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=4Bgg4P-xnHY'))
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.title) { document.getElementById('title').textContent = d.title; document.title = d.title + ' | WWE Network'; } })
    .catch(function () {});
</script>
</body>
</html>
