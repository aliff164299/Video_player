<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WWE Network Style Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--red:#e4002b;--red-hot:#ff1f45;--black:#050505;--white:#fff;--muted:#b3b3b3;
    --display:"Oswald","Impact","Arial Narrow",sans-serif;--body:"Inter","Helvetica Neue",Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--black);scroll-behavior:smooth}
  body{font-family:var(--body);color:var(--white);background:var(--black);min-height:100vh;overflow-x:hidden}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

  /* ---------- Header ---------- */
  header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:32px;padding:16px 4vw;
    background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);transition:background .3s}
  header.solid{background:#000;box-shadow:0 2px 0 var(--red)}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:2px;text-transform:uppercase;line-height:1}
  .logo b{background:var(--red);padding:4px 10px 4px 8px;transform:skewX(-12deg);display:inline-block}
  .logo b i{display:inline-block;transform:skewX(12deg);font-style:normal}
  .logo span{font-weight:500;letter-spacing:4px;font-size:18px}
  nav{display:flex;gap:24px;font-family:var(--display);text-transform:uppercase;letter-spacing:1.5px;font-size:15px}
  nav a{color:#ddd;text-decoration:none;border-bottom:2px solid transparent;padding:4px 0;transition:.2s}
  nav a:hover,nav a.on{color:#fff;border-color:var(--red)}
  .right{margin-left:auto;display:flex;align-items:center;gap:18px}
  .live{display:flex;align-items:center;gap:8px;font-family:var(--display);letter-spacing:2px;font-size:13px;background:var(--red);padding:5px 14px;transform:skewX(-12deg)}
  .live>*{transform:skewX(12deg)}
  .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.2}}
  .avatar{width:34px;height:34px;background:var(--red);display:grid;place-items:center;font-family:var(--display);clip-path:polygon(0 0,100% 0,100% 70%,70% 100%,0 100%)}
