<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WWE Network Style Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--red:#e4002b;--red-hot:#ff1f45;--black:#050505;--white:#fff;--muted:#b3b3b3;
    --display:"Oswald","Impact","Arial Narrow",sans-serif;--body:"Inter","Helvetica Neue",Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--black);scroll-behavior:smooth}
  body{font-family:var(--body);color:var(--white);background:var(--black);min-height:100vh;overflow-x:hidden}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

  /* ---------- Header ---------- */
  header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:32px;padding:16px 4vw;
    background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);transition:background .3s}
  header.solid{background:#000;box-shadow:0 2px 0 var(--red)}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:2px;text-transform:uppercase;line-height:1}
  .logo b{background:var(--red);padding:4px 10px 4px 8px;transform:skewX(-12deg);display:inline-block}
  .logo b i{display:inline-block;transform:skewX(12deg);font-style:normal}
  .logo span{font-weight:500;letter-spacing:4px;font-size:18px}
  nav{display:flex;gap:24px;font-family:var(--display);text-transform:uppercase;letter-spacing:1.5px;font-size:15px}
  nav a{color:#ddd;text-decoration:none;border-bottom:2px solid transparent;padding:4px 0;transition:.2s}
  nav a:hover,nav a.on{color:#fff;border-color:var(--red)}
  .right{margin-left:auto;display:flex;align-items:center;gap:18px}
  .live{display:flex;align-items:center;gap:8px;font-family:var(--display);letter-spacing:2px;font-size:13px;background:var(--red);padding:5px 14px;transform:skewX(-12deg)}
  .live>*{transform:skewX(12deg)}
  .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.2}}
  .avatar{width:34px;height:34px;background:var(--red);display:grid;place-items:center;font-family:var(--display);clip-path:polygon(0 0,100% 0,100% 70%,70% 100%,0 100%)}

  /* ---------- Hero billboard ---------- */
  .hero{position:relative;min-height:92vh;display:flex;align-items:flex-end;overflow:hidden}
  .hero-bg{position:absolute;inset:0;background:#111 center/cover no-repeat;animation:drift 22s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
  .hero::before{content:"";position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(90deg,#000 0,rgba(0,0,0,.82) 28%,rgba(0,0,0,.15) 65%,rgba(0,0,0,.35) 100%),
      linear-gradient(to top,var(--black) 2%,transparent 45%)}
  .hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(112deg,transparent 0 62%,rgba(228,0,43,.35) 62.2% 63.6%,transparent 63.8% 66%,rgba(228,0,43,.16) 66.2% 67%,transparent 67.2%)}
  .hero-body{position:relative;z-index:2;padding:0 4vw 13vh;max-width:760px}
  .tag{display:flex;align-items:center;gap:12px;font-family:var(--display);letter-spacing:4px;text-transform:uppercase;font-size:14px;color:var(--red-hot);margin-bottom:14px}
  .tag::before{content:"";width:44px;height:4px;background:var(--red);transform:skewX(-30deg)}
  h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(34px,6.2vw,78px);line-height:1;letter-spacing:.5px;text-shadow:0 6px 30px rgba(0,0,0,.9);margin-bottom:20px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px;font-size:13px;font-weight:600}
  .chip{padding:3px 9px;border:1px solid rgba(255,255,255,.55);letter-spacing:1px;text-transform:uppercase;font-size:11px}
  .chip.red{background:var(--red);border-color:var(--red)}
  .match{color:#46d369;font-weight:800}
  .btns{display:flex;flex-wrap:wrap;gap:14px}
  .btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);text-transform:uppercase;letter-spacing:2px;font-size:18px;padding:13px 32px;text-decoration:none;transition:.2s}
  .btn svg{width:22px;height:22px;fill:currentColor}
  .btn.play{background:#fff;color:#000}
  .btn.play:hover{background:var(--red);color:#fff;box-shadow:0 0 30px rgba(228,0,43,.7)}
  .btn.more{background:rgba(120,120,120,.55);color:#fff;backdrop-filter:blur(6px)}
  .btn.more:hover{background:rgba(160,160,160,.6)}

  /* ---------- Rows ---------- */
  .rows{position:relative;z-index:3;margin-top:-9vh;padding-bottom:60px}
  .row{padding:0 4vw;margin-bottom:38px}
  .row h2{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:22px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
  .row h2::before{content:"";width:5px;height:22px;background:var(--red);transform:skewX(-14deg)}
  .track{display:flex;gap:14px;overflow-x:auto;padding:14px 0 26px;scrollbar-width:none}
  .track::-webkit-scrollbar{display:none}

  .card{position:relative;flex:0 0 auto;width:clamp(230px,24vw,340px);aspect-ratio:16/9;background:#111 center/cover no-repeat;cursor:pointer;
    transition:transform .3s,box-shadow .3s;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 55%)}
  .card:hover{transform:scale(1.08);z-index:5}
  .card .ttl{position:absolute;left:12px;right:12px;bottom:14px;z-index:2;font-family:var(--display);text-transform:uppercase;font-size:14px;letter-spacing:.5px;line-height:1.2;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .pi{position:absolute;inset:0;z-index:2;display:grid;place-items:center;opacity:0;transition:.25s}
  .card:hover .pi{opacity:1}
  .pi i{width:54px;height:54px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 0 24px rgba(228,0,43,.8)}
  .pi svg{width:24px;height:24px;fill:#fff;margin-left:3px}
  .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25);z-index:3}
  .prog u{display:block;height:100%;width:38%;background:var(--red)}
  .new{position:absolute;top:0;left:0;z-index:3;background:var(--red);font-family:var(--display);font-size:11px;letter-spacing:2px;padding:3px 10px}

  /* Top 10 */
  .top{display:flex;align-items:center;flex:0 0 auto}
  .num{font-family:var(--display);font-weight:700;font-size:clamp(130px,16vw,210px);line-height:.8;color:#000;-webkit-text-stroke:3px #fff;margin-right:-26px;position:relative;z-index:1;letter-spacing:-6px}
  .top .card{z-index:2}

  /* ---------- Modal player ---------- */
  .modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:4vw;backdrop-filter:blur(8px)}
  .modal.open{display:flex;animation:fade .3s}
  @keyframes fade{from{opacity:0}}
  .stage{position:relative;width:min(1100px,100%);aspect-ratio:16/9;background:#000;box-shadow:0 0 80px rgba(228,0,43,.55);border-top:3px solid var(--red)}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .close{position:absolute;top:-46px;right:0;font-family:var(--display);letter-spacing:2px;font-size:14px;text-transform:uppercase;color:#fff;padding:8px 14px;background:var(--red);transform:skewX(-12deg)}
  .close:hover{background:var(--red-hot)}

  footer{text-align:center;color:#666;font-size:12px;letter-spacing:1px;padding:0 5vw 34px}

  @media (max-width:720px){
    nav,.avatar{display:none}
    .hero{min-height:78vh}
    .hero-body{padding-bottom:12vh}
    .btn{font-size:15px;padding:11px 22px}
    .num{-webkit-text-stroke:2px #fff}
  }
</style>
</head>
<body>

<header id="hdr">
  <div class="logo"><b><i>WWE</i></b><span>Network</span></div>
  <nav><a class="on" href="#">Home</a><a href="#">Live</a><a href="#">Shows</a><a href="#">Events</a><a href="#">My List</a></nav>
  <div class="right"><div class="live"><span class="dot"></span><span>LIVE</span></div><div class="avatar">W</div></div>
</header>

<section class="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-body">
    <div class="tag">Now Streaming</div>
    <h1 id="heroTitle">WWE</h1>
    <div class="chips">
      <span class="match">98% Match</span>
      <span class="chip red">Full Event</span>
      <span class="chip">HD</span>
      <span class="chip">Live Event</span>
    </div>
    <div class="btns">
      <button class="btn play" id="heroPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Play</button>
      <a class="btn more" id="heroYt" target="_blank" rel="noopener" href="#">Watch on YouTube</a>
    </div>
  </div>
</section>

<main class="rows" id="rows"></main>

<footer>FAN-MADE PLAYER PAGE &bull; NOT AFFILIATED WITH WWE</footer>

<div class="modal" id="modal">
  <div class="stage" id="stage"><button class="close" id="close">Close &#10005;</button></div>
</div>

<script>
  /* ===== Add more videos here: just paste the YouTube ID ===== */
  var VIDEOS = [
    { id: '4Bgg4P-xnHY', title: 'WWE' }
  ];

  var PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  function thumb(id){ return "url('https://i.ytimg.com/vi/" + id + "/maxresdefault.jpg'),url('https://i.ytimg.com/vi/" + id + "/hqdefault.jpg')"; }
  function watchUrl(id){ return 'https://www.youtube.com/watch?v=' + id; }

  /* Hero */
  var main = VIDEOS[0];
  document.getElementById('heroBg').style.backgroundImage = thumb(main.id);
  document.getElementById('heroTitle').textContent = main.title;
  document.getElementById('heroYt').href = watchUrl(main.id);

  /* Rows */
  var rows = document.getElementById('rows');
  function cardHTML(v, extra){
    return '<div class="card" data-id="' + v.id + '" style="background-image:' + thumb(v.id) + '">' + (extra||'') +
      '<div class="pi"><i>' + PLAY_SVG + '</i></div><div class="ttl" data-t="' + v.id + '">' + v.title + '</div></div>';
  }
  function row(title, inner){
    var s = document.createElement('section'); s.className = 'row';
    s.innerHTML = '<h2>' + title + '</h2><div class="track">' + inner + '</div>';
    rows.appendChild(s);
  }
  row('Continue Watching', VIDEOS.map(function(v){ return cardHTML(v, '<div class="prog"><u></u></div>'); }).join(''));
  row('Top 10 on Network Today', VIDEOS.map(function(v,i){
    return '<div class="top"><div class="num">' + (i+1) + '</div>' + cardHTML(v, '<span class="new">TRENDING</span>') + '</div>';
  }).join(''));
  row('Featured Events', VIDEOS.map(function(v){ return cardHTML(v, '<span class="new">FULL EVENT</span>'); }).join(''));

  /* Player modal */
  var modal = document.getElementById('modal'), stage = document.getElementById('stage');
  function openPlayer(id){
    // YouTube blocks embeds on file:// pages (error 153): open directly there
    if (location.protocol === 'file:') { window.open(watchUrl(id), '_blank', 'noopener'); return; }
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&origin=' + encodeURIComponent(location.origin);
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.title = 'Video player';
    stage.appendChild(f);
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closePlayer(){
    modal.classList.remove('open');
    var f = stage.querySelector('iframe'); if (f) f.remove();
    document.body.style.overflow = '';
  }
  document.getElementById('heroPlay').addEventListener('click', function(){ openPlayer(main.id); });
  rows.addEventListener('click', function(e){
    var c = e.target.closest('.card'); if (c) openPlayer(c.dataset.id);
  });
  document.getElementById('close').addEventListener('click', closePlayer);
  modal.addEventListener('click', function(e){ if (e.target === modal) closePlayer(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closePlayer(); });

  /* Sticky header */
  var hdr = document.getElementById('hdr');
  addEventListener('scroll', function(){ hdr.classList.toggle('solid', scrollY > 60); });

  /* Load real titles from YouTube */
  VIDEOS.forEach(function(v){
    fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(watchUrl(v.id)))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.title) return;
        v.title = d.title;
        document.querySelectorAll('[data-t="' + v.id + '"]').forEach(function(el){ el.textContent = d.title; });
        if (v === main) {
          document.getElementById('heroTitle').textContent = d.title;
          document.title = d.title + ' | WWE Network';
        }
      }).catch(function(){});
  });
</script>
</body>
</html>
