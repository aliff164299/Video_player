<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WWE Network Style Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="hdr">
  <a class="logo" href="index.html"><b><i>WWE</i></b><span>Network</span></a>
  <nav><a class="on" href="index.html">Home</a><a href="#rows">Browse</a></nav>
  <div class="right"><div class="live"><span class="dot"></span><span>LIVE</span></div></div>
</header>

<section class="hero">
  <div id="heroBgs"></div>
  <div class="hero-body">
    <div class="tag">Featured</div>
    <h1 id="heroTitle">WWE</h1>
    <div class="chips">
      <span class="chip red">Full Event</span>
      <span class="chip">HD</span>
    </div>
    <div class="btns">
      <a class="btn play" id="heroPlay" href="#"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Play</a>
      <a class="btn more" id="heroYt" target="_blank" rel="noopener" href="#">Watch on YouTube</a>
    </div>
  </div>
  <div class="dots" id="dots"></div>
</section>

<main class="rows" id="rows"></main>

<footer>FAN-MADE PLAYER PAGE &bull; NOT AFFILIATED WITH WWE</footer>

<script src="videos.js"></script>
<script>
  var INTERVAL = 6000;           // milliseconds per slide
  var main = VIDEOS[0];
  var bgs = document.getElementById('heroBgs');
  var dots = document.getElementById('dots');
  var body = document.querySelector('.hero-body');
  var cur = 0, timer = null;

  VIDEOS.forEach(function (v, i) {
    var d = document.createElement('div');
    d.className = 'hero-bg';
    d.style.backgroundImage = thumb(v.id);
    bgs.appendChild(d);
    if (VIDEOS.length > 1) {
      var b = document.createElement('button');
      b.setAttribute('aria-label', 'Show featured video ' + (i + 1));
      b.addEventListener('click', function () { show(i, true); });
      dots.appendChild(b);
    }
  });

  function fillText(v) {
    document.getElementById('heroTitle').textContent = v.title;
    document.getElementById('heroPlay').href = pageUrl(v.id);
    document.getElementById('heroYt').href = ytUrl(v.id);
  }

  function show(i, restart) {
    var first = (timer === null && !restart && i === 0 && !bgs.querySelector('.on'));
    var v = VIDEOS[i];
    var layers = bgs.children, btns = dots.children;
    if (first) { fillText(v); }
    else {
      body.classList.add('swap');
      setTimeout(function () { fillText(v); body.classList.remove('swap'); }, 350);
    }
    for (var k = 0; k < layers.length; k++) layers[k].classList.toggle('on', k === i);
    for (var j = 0; j < btns.length; j++) {
      btns[j].classList.remove('on');
      if (j === i) { void btns[j].offsetWidth; btns[j].classList.add('on'); }
    }
    cur = i;
    schedule();
  }

  function schedule() {
    clearTimeout(timer);
    if (VIDEOS.length < 2) { timer = 0; return; }
    dots.style.setProperty('--dur', INTERVAL + 'ms');
    timer = setTimeout(function () { show((cur + 1) % VIDEOS.length); }, INTERVAL);
  }

  /* Pause while the pointer is over the banner */
  var hero = document.querySelector('.hero');
  hero.addEventListener('mouseenter', function () { clearTimeout(timer); dots.classList.add('paused'); });
  hero.addEventListener('mouseleave', function () { dots.classList.remove('paused'); show(cur, true); });

  show(0);

  var rows = document.getElementById('rows');
  addRow(rows, 'Top 10 on Network Today', VIDEOS.slice(0, 10).map(function (v, i) {
    return '<div class="top"><div class="num">' + (i + 1) + '</div>' + cardHTML(v, 'TRENDING') + '</div>';
  }).join(''));
  addRow(rows, 'Featured Events', VIDEOS.map(function (v) { return cardHTML(v, 'FULL EVENT'); }).join(''));

  loadTitles(function (v) {
    if (v === VIDEOS[cur]) document.getElementById('heroTitle').textContent = v.title;
    if (v === main) document.title = v.title + ' | WWE Network';
  });
</script>
</body>
</html>
